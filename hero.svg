<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml">
  <defs>
    <style>
      @keyframes floatCard {
        0%   { transform: translateY(0px); }
        50%  { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes fadeInUp {
        0%   { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes glow {
        0%, 100% { box-shadow: 0 0 18px rgba(111,207,151,0.25); }
        50%      { box-shadow: 0 0 28px rgba(242,169,59,0.35); }
      }
      @keyframes drift {
        0%   { background-position: center 0%, center; }
        50%  { background-position: center 4%, center; }
        100% { background-position: center 0%, center; }
      }

      html, body {
        margin: 0;
        padding: 0;
      }

      .card-wrap {
        width: 1000px;
        height: 320px;
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        box-sizing: border-box;
      }

      .card {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 32px;
        padding: 36px 44px;
        border-radius: 22px;
        color: #F3EFE7;
        border: 1px solid rgba(243,239,231,0.10);
        overflow: hidden;
        position: relative;

        /* Nebula background image */
        background-image: url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGh[...]');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        animation: floatCard 5s ease-in-out infinite,
                   glow 6s ease-in-out infinite,
                   drift 14s ease-in-out infinite;
      }

      .avatar-ring {
        flex-shrink: 0;
        width: 148px;
        height: 148px;
        border-radius: 50%;
        padding: 2px;
        background: conic-gradient(from 180deg, #6FCF97, #F2A93B, #6FCF97);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 2;
      }

      .avatar {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #12101c;
        background: #1a1729;
      }

      .content {
        display: flex;
        flex-direction: column;
        gap: 10px;
        animation: fadeInUp 0.9s ease-out;
        position: relative;
        z-index: 2;
      }

      .name {
        font-size: 32px;
        font-weight: 700;
        margin: 0;
        color: #F3EFE7;
        letter-spacing: 0.3px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.55);
      }

      .name span.accent {
        color: #6FCF97;
      }

      .tagline {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        color: #F2A93B;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-shadow: 0 1px 6px rgba(0,0,0,0.5);
      }

      .bio {
        font-size: 14.5px;
        line-height: 1.55;
        margin: 4px 0 6px 0;
        color: rgba(243,239,231,0.88);
        max-width: 620px;
        text-shadow: 0 1px 8px rgba(0,0,0,0.5);
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }

      .badge {
        font-size: 12px;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid rgba(111,207,151,0.5);
        background: rgba(18,16,28,0.55);
        color: #6FCF97;
        white-space: nowrap;
      }

      .badge.gold {
        border-color: rgba(242,169,59,0.55);
        background: rgba(18,16,28,0.55);
        color: #F2A93B;
      }

      /* Light mode overrides */
      @media (prefers-color-scheme: light) {
        .card {
          color: #12101c;
          border: 1px solid rgba(18,16,28,0.08);
          background-image: url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChM[...]');
        }
        .name { color: #12101c; text-shadow: none; }
        .bio { color: rgba(18,16,28,0.80); text-shadow: none; }
        .tagline { color: #d98d1f; text-shadow: none; }
        .badge {
          border-color: rgba(46,148,101,0.55);
          background: rgba(243,239,231,0.75);
          color: #2e9465;
        }
        .badge.gold {
          border-color: rgba(217,141,31,0.55);
          background: rgba(243,239,231,0.75);
          color: #d98d1f;
        }
        .avatar {
          border-color: #F3EFE7;
        }
      }
    </style>
  </defs>

  <foreignObject x="0" y="0" width="1000" height="320">
    <xhtml:div class="card-wrap">
      <xhtml:div class="card">
        <xhtml:div class="avatar-ring">
          <xhtml:img class="avatar" src="https://raw.githubusercontent.com/Arsh123344423/Arsh123344423/main/Arsh%20Image.PNG" alt="Arsh Srivastava" />
        </xhtml:div>
        <xhtml:div class="content">
          <xhtml:p class="tagline">Software Engineer · AI/ML Engineer</xhtml:p>
          <xhtml:h1 class="name">Hi, I'm <xhtml:span class="accent">Arsh Srivastava</xhtml:span> 👋</xhtml:h1>
          <xhtml:p class="bio">
            Building AI agents, fintech infrastructure, and the occasional web3 experiment.
            I like systems that automate the boring parts and get out of the way.
            Open to internships &amp; AI/ML roles · Currently building agent orchestration tooling.
          </xhtml:p>
          <xhtml:div class="badges">
            <xhtml:span class="badge">🤖 Agentic AI</xhtml:span>
            <xhtml:span class="badge gold">🧩 Full-Stack</xhtml:span>
            <xhtml:span class="badge">💳 Fintech</xhtml:span>
            <xhtml:span class="badge gold">📚 RAG</xhtml:span>
            <xhtml:span class="badge">🕸️ LangGraph</xhtml:span>
          </xhtml:div>
        </xhtml:div>
      </xhtml:div>
    </xhtml:div>
  </foreignObject>
</svg>